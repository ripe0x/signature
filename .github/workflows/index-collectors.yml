name: Index Collectors

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

env:
  IMAGE_API_URL: https://fold-image-api.fly.dev
  ADMIN_ADDRESS: '0xCB43078C32423F5348Cab5885911C3B5faE217F9'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trigger image-api indexer
        run: |
          echo "Triggering image-api indexer..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$IMAGE_API_URL/api/admin/index-collectors" \
            -H "Content-Type: application/json" \
            -d "{\"address\": \"$ADMIN_ADDRESS\"}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Image-api indexer completed successfully"
          else
            echo "Warning: Image-api indexer returned $http_code (continuing with local indexer)"
          fi

      - name: Install dependencies
        run: npm install

      - name: Run local indexer (backup)
        run: node scripts/index-collectors.js
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      - name: Commit updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/leaderboard.json
          git diff --staged --quiet || git commit -m "chore: update collector leaderboard"
          git push
